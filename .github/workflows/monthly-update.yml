name: 월 데이터 업데이트

on:
  workflow_dispatch:
    inputs:
      month:
        description: "업데이트할 월(YYYY-MM, 비워두면 현재월)"
        required: false
        type: string
  schedule:
    - cron: "0 0 1 * *"
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: monthly-market-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: 실행 여부 확인
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MONTH: ${{ inputs.month }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone

          KST = timezone(timedelta(hours=9))

          def current_month():
              return datetime.now(KST).strftime("%Y-%m")

          event = os.environ.get("EVENT_NAME", "")
          schedule = os.environ.get("EVENT_SCHEDULE", "")
          month = (os.environ.get("INPUT_MONTH", "") or "").strip()
          run = event == "workflow_dispatch" or schedule == "0 0 1 * *"
          requested = False
          requested_at = ""
          current_status = {}

          try:
              request = urllib.request.Request(
                  "https://marketresearch--marketresearch-ff4fc.asia-east1.hosted.app/api/update",
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  current_status = json.load(response).get("status") or {}
          except Exception as exc:
              print(f"업데이트 상태 확인 실패: {exc}")

          if schedule == "*/5 * * * *":
              status = current_status
              if status.get("state") == "requested" and status.get("month"):
                  run = True
                  requested = True
                  month = status["month"]
                  requested_at = status.get("requestedAt", "")

          if event == "workflow_dispatch":
              if not month:
                  if current_status.get("state") in {"requested", "running"} and current_status.get("month"):
                      month = current_status["month"]
                  else:
                      month = current_month()
              if (
                  current_status.get("month") == month
                  and current_status.get("state") in {"requested", "running"}
              ):
                  requested = True
                  requested_at = current_status.get("requestedAt", "")

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as fp:
              fp.write(f"run={'true' if run else 'false'}\n")
              fp.write(f"requested={'true' if requested else 'false'}\n")
              fp.write(f"month={month}\n")
              fp.write(f"requested_at={requested_at}\n")
          PY

      - name: 업데이트 시작 상태 알림
        if: steps.gate.outputs.requested == 'true'
        env:
          UPDATE_MONTH: ${{ steps.gate.outputs.month }}
          REQUESTED_AT: ${{ steps.gate.outputs.requested_at }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          payload = json.dumps({
              "state": "running",
              "month": os.environ.get("UPDATE_MONTH", ""),
              "requestedAt": os.environ.get("REQUESTED_AT", ""),
              "startedAt": datetime.now(timezone.utc).isoformat(),
              "message": "GitHub 자동 수집 작업이 시작되었습니다.",
          }, ensure_ascii=False).encode("utf-8")

          request = urllib.request.Request(
              "https://marketresearch--marketresearch-ff4fc.asia-east1.hosted.app/api/update/complete",
              data=payload,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json",
                  "x-update-callback": "c7ef1d9a4b6240f69837e2ab51d2c8f4",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              print(response.read().decode("utf-8"))
          PY

      - name: Python 준비
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집 라이브러리 설치
        if: steps.gate.outputs.run == 'true'
        run: pip install requests beautifulsoup4

      - name: 월 데이터 수집 및 대시보드 반영
        if: steps.gate.outputs.run == 'true'
        env:
          UPDATE_MONTH: ${{ steps.gate.outputs.month }}
        run: python automation/monthly_update.py --month "$UPDATE_MONTH"

      - name: 사용자검토 자동 정리
        if: steps.gate.outputs.run == 'true'
        env:
          UPDATE_MONTH: ${{ steps.gate.outputs.month }}
        run: |
          python -m automation.resolve_reviews "$UPDATE_MONTH"
          python automation/promote_confirmed_reviews.py
          python automation/repair_app_data.py

      - name: 결과 요약
        if: steps.gate.outputs.run == 'true'
        run: |
          echo "## 더런드리 월 데이터 업데이트" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat automation/last-update.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 변경사항 커밋
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "더런드리 업데이트 봇"
          git config user.email "actions@users.noreply.github.com"
          git add index.html automation/last-update.json
          if git diff --cached --quiet; then
            echo "추가 변경사항이 없습니다."
          else
            git commit -m "data: 셀프빨래방 시장 데이터 업데이트"
            git push
          fi

      - name: 업데이트 완료/실패 상태 알림
        if: always() && steps.gate.outputs.run == 'true'
        env:
          UPDATE_MONTH: ${{ steps.gate.outputs.month }}
          REQUESTED_AT: ${{ steps.gate.outputs.requested_at }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          summary = {}
          try:
              with open("automation/last-update.json", encoding="utf-8") as fp:
                  summary = json.load(fp)
          except FileNotFoundError:
              summary = {}

          job_status = os.environ.get("JOB_STATUS", "")
          state = "completed" if job_status == "success" else "failed"
          message = (
              "데이터 업데이트가 완료되었습니다."
              if state == "completed"
              else f"데이터 업데이트가 실패했습니다. GitHub Actions 상태: {job_status}"
          )

          payload = json.dumps({
              "state": state,
              "month": os.environ.get("UPDATE_MONTH", ""),
              "requestedAt": os.environ.get("REQUESTED_AT", ""),
              "completedAt": datetime.now(timezone.utc).isoformat(),
              "summary": summary,
              "message": message,
          }, ensure_ascii=False).encode("utf-8")

          request = urllib.request.Request(
              "https://marketresearch--marketresearch-ff4fc.asia-east1.hosted.app/api/update/complete",
              data=payload,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json",
                  "x-update-callback": "c7ef1d9a4b6240f69837e2ab51d2c8f4",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              print(response.read().decode("utf-8"))
          PY
